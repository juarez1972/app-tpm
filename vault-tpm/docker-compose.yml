services:
  tpm-validator:
    build: 
    ports:
      - "5000:5000"
    volumes:
      - /dev/tpm0:/dev/tpm0
      - ./tpm-data:/app/tpm-data
     environment:
      -  VAULT_LOCAL_CONFIG='
        {
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "tls_disable": 0  # Habilitar TLS em produção
          } 
        }],
          "storage": {
            "file": {
              "path": "/vault/data"
            }
          },
          "ui": true,
          "api_addr": "https://vault:8200"
        }'

    networks:
      - tpm-vault-network
    restart: unless-stopped

  vault:
    image: vault:latest
    ports:
      - "8200:8200"
    volumes:
      - ./vault-data:/vault/data
      - ./vault-config.hcl:/vault/config/vault-config.hcl
    cap_add:
      - IPC_LOCK
    networks:
      - tpm-vault-network
    restart: unless-stopped
    command: server -config /vault/config/vault-config.hcl

  vault-initializer:
    build: ./vault-init
    environment:
      - TPM_VALIDATOR_URL=http://tpm-validator:5000
      - VAULT_ADDR=http://vault:8200
      - VAULT_CLUSTER_ADDR=https://vault:8201
      # Modo produção requer HTTPS
      - VAULT_DEV_ROOT_TOKEN_ID=dev-only-token
    volumes:
      - ./tpm-data:/app/tpm-data
    networks:
      - tpm-vault-network
    restart: unless-stopped
    depends_on:
      - vault

networks:
  tpm-vault-network:
    driver: bridge
