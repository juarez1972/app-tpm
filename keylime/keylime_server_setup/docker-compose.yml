version: '3.8'

services:
  keylime-registrar:
    build: .
    container_name: keylime-registrar
    hostname: keylime-registrar
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./keylime-data:/var/lib/keylime
      - ./keylime-config:/etc/keylime
    command: >
      sh -c "
      mkdir -p /var/lib/keylime &&
      echo 'Starting Keylime Registrar with Python 3...' &&
      python3 -m keylime.cmd.registrar
      "

  keylime-verifier:
    build: .
    container_name: keylime-verifier
    hostname: keylime-verifier
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./keylime-data:/var/lib/keylime
      - ./keylime-config:/etc/keylime
    command: >
      sh -c "
      echo 'Waiting for registrar...' &&
      sleep 35 &&
      echo 'Starting Keylime Verifier with Python 3...' &&
      python3 -m keylime.cmd.verifier
      "
