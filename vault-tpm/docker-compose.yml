version: '3.8'

services:
  vault:
    image: vault:1.13.3
    container_name: vault
    ports:
      - "8201:8200"
    command: server -config=/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/data:/vault/file
      - ./vault/logs:/vault/logs
    networks:
      - vault-network

  vault-initializer:
    build: ./vault-init
    container_name: vault-initializer
    volumes:
      - ./tpm-data:/app/tpm-data
    devices:
      - "/dev/tpmrm0:/dev/tpmrm0"
    environment:
      - VAULT_ADDR=http://vault:8200
    depends_on:
      - vault
    networks:
      - vault-network

  tpm-validator:
    build: ./tpm-validator
    container_name: tpm-validator
    volumes:
      - ./tpm-data:/app/tpm-data
    devices:
      - "/dev/tpmrm0:/dev/tpmrm0"
    ports:
      - "8080:8080"  # Para health checks
    depends_on:
      - vault-initializer
    networks:
      - vault-network

networks:
  vault-network:
    driver: bridge
