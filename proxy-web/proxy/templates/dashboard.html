<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aplicações</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f9fa] min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">P</div>
            <span class="font-semibold text-gray-700">Proxy Juarez</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
                <p class="text-xs font-medium text-gray-900">{{ user.name }}</p>
                <p class="text-[10px] text-gray-500">{{ user.email }}</p>
            </div>
            <img src="{{ user.picture }}" class="w-9 h-9 rounded-full border border-gray-200 shadow-sm">
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-6 py-12">
        <h2 class="text-2xl font-light text-gray-800 mb-8">Aplicações Disponíveis</h2>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            {% for app_id, info in apps.items() %}
            <a href="/go/{{ app_id }}/" class="flex flex-col items-center group">
                <div class="w-20 h-20 bg-white rounded-2xl shadow-sm border border-gray-100 flex items-center justify-center mb-3 group-hover:shadow-md group-hover:-translate-y-1 transition-all duration-200">
                    <img src="{{ info.icon }}" class="w-12 h-12 object-contain grayscale-[0.3] group-hover:grayscale-0 transition-all">
                </div>
                <span class="text-sm font-medium text-gray-600 group-hover:text-blue-600 transition-colors">{{ info.name }}</span>
            </a>
            {% endfor %}
        </div>

        {% if not apps %}
        <div class="bg-white p-8 rounded-xl border border-dashed border-gray-300 text-center">
            <p class="text-gray-500">Nenhuma aplicação vinculada ao seu e-mail.</p>
        </div>
        {% endif %}
    </main>
</body>
</html>
