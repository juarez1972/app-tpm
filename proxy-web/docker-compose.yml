version: "3.9"

services:
  proxy-flask:
    build: ./proxy
    container_name: proxy-flask
    ports:
      - "443:443"
    env_file:
      - .env
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FLASK_SECRET=${FLASK_SECRET}
      - ALLOWED_USERS=${ALLOWED_USERS}
      - ALLOWED_LOGIN_DOMAIN=${ALLOWED_LOGIN_DOMAIN}
      - EXTERNAL_DOMAIN=${EXTERNAL_DOMAIN}   # 🔥 ESSENCIAL
    volumes:
      - ./proxy/certs:/app/certs
      - ./proxy/templates:/app/templates
    depends_on:
      - nginx-internal
      - grafana
    networks:
      - backend
    restart: always

  nginx-internal:
    image: nginx:alpine
    container_name: nginx-internal
    command: >
      /bin/sh -c "printf 'server {
        listen 8080;
        location / {
          root /usr/share/nginx/html;
          index index.html;
        }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - backend
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana-internal
    restart: always
    environment:
      - GF_SERVER_DOMAIN=${EXTERNAL_DOMAIN}
      - GF_SERVER_ROOT_URL=https://${EXTERNAL_DOMAIN}/go/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true # Mantenha true, mas o app.py não deve duplicar o path
      - GF_SECURITY_COOKIE_NAME=grafana_session_juarez
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
    networks:
      - backend

volumes:
  grafana_data:

networks:
  backend:
    driver: bridge
