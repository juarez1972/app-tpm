version: '3.8'

services:
  vault:
    image: vault:1.13.3
    container_name: vault
    ports:
      - "8201:8200"
    command: server -config=/vault/config/vault-config.hcl
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ./vault-data:/vault/file
    networks:
      - vault-network
    restart: unless-stopped

  vault-initializer:
    build: ./vault-init
    container_name: vault-initializer
    volumes:
      - ./tpm-data:/app/tpm-data
    devices:
      - "/dev/tpmrm0:/dev/tpmrm0"
    environment:
      - VAULT_ADDR=http://vault:8200
    depends_on:
      - vault
    networks:
      - vault-network
    restart: "no"

  tpm-validator:
    build: ./tpm-validator
    container_name: tpm-validator
    volumes:
      - ./tpm-data:/app/tpm-data
    devices:
      - "/dev/tpmrm0:/dev/tpmrm0"
    ports:
      - "8080:8080"
    depends_on:
      - vault-initializer
    networks:
      - vault-network
    restart: unless-stopped

networks:
  vault-network:
    driver: bridge
