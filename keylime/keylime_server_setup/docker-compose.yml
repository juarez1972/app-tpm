version: '3.8'

services:
  keylime-registrar:
    build: .
    container_name: keylime-registrar
    hostname: keylime-registrar
    restart: unless-stopped
    network_mode: host
    command: ["python3", "-m", "keylime.cmd.registrar"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import keylime; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  keylime-verifier:
    build: .
    container_name: keylime-verifier
    hostname: keylime-verifier
    restart: unless-stopped
    network_mode: host
    depends_on:
      keylime-registrar:
        condition: service_healthy
    command: >
      sh -c "echo 'Waiting for registrar...' && 
             sleep 20 && 
             echo 'Starting verifier...' && 
             python3 -m keylime.cmd.verifier"
    healthcheck:
      test: ["CMD", "python3", "-c", "import keylime; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
