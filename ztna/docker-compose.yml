# ─────────────────────────────────────────────────────────────────────────────
# Twingate Connector — deploy on-premises via Docker (Camada 3 / ZTNA)
#
# Equivalente ao "Deploy Connector → On-premises → Docker" do Admin Console do
# Twingate. Roda no servidor PPGIA96, ao lado do Vault (vault-tpm) e do servidor
# IoT (iot-tpm), publicando esses recursos internos sem abrir portas de entrada.
#
# Tokens: gerados no Admin Console (Network → Connectors → Deploy → Docker).
# Copie ztna/.env.example para ztna/.env e preencha antes de subir.
#
#   cd app-tpm/ztna/
#   cp .env.example .env      # preencha TWINGATE_NETWORK / ACCESS / REFRESH
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────
services:
  twingate-connector:
    image: twingate/connector:1
    container_name: twingate-connector-ppgia96
    restart: unless-stopped
    pull_policy: always
    # Necessário para o Connector medir latência (ICMP) até os recursos internos.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    environment:
      # Nome da sua rede Twingate (o "networkname" em networkname.twingate.com).
      TWINGATE_NETWORK: "${TWINGATE_NETWORK}"
      # Tokens do Connector (gerados no Admin Console — NÃO versionar).
      TWINGATE_ACCESS_TOKEN: "${TWINGATE_ACCESS_TOKEN}"
      TWINGATE_REFRESH_TOKEN: "${TWINGATE_REFRESH_TOKEN}"
      # Rótulos informativos exibidos no Admin Console.
      TWINGATE_LABEL_HOSTNAME: "${TWINGATE_LABEL_HOSTNAME:-ppgia96}"
      TWINGATE_LABEL_DEPLOYED_BY: "docker-compose"
      # Formato de timestamp dos logs (2 = ISO 8601).
      TWINGATE_TIMESTAMP_FORMAT: "2"
    # Watchtower (opcional) pode atualizar o Connector automaticamente.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
