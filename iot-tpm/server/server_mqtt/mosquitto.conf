import os
import sys
import time
import json
import subprocess

import paho.mqtt.client as mqtt
import pyotp
from dotenv import load_dotenv

load_dotenv()

# ── Variáveis de ambiente obrigatórias ───────────────────────────────────────
REQUIRED_ENV = ["OTP_SECRET", "MQTT_BROKER", "MQTT_PORT", "MQTT_TOPIC_VERIFY"]
missing = [var for var in REQUIRED_ENV if not os.getenv(var)]
if missing:
    print(f"ERRO: Variáveis de ambiente ausentes ou vazias: {', '.join(missing)}")
    print("Crie o arquivo .env na raiz do projeto com base no README (Seção 5).")
    sys.exit(1)

CLIENT_ID   = "device-001"
OTP_SECRET  = os.getenv("OTP_SECRET")
MQTT_BROKER = os.getenv("MQTT_BROKER")
MQTT_PORT   = int(os.getenv("MQTT_PORT"))
CA_CERT     = os.getenv("CA_CERT")        # opcional — TLS só ativo se o arquivo existir
MQTT_TOPIC  = os.getenv("MQTT_TOPIC_VERIFY")


def check_tpm() -> bool:
    """Verifica se o hardware TPM está presente e funcional."""
    try:
        subprocess.run(
            ["tpm2_getrandom", "4"],
            capture_output=True,
            check=True,
        )
        return True
    except Exception:
        return False


def on_connect(client, userdata, flags, rc, properties=None):
    if rc == 0:
        print("Conectado ao broker MQTT.")
        client.subscribe(f"iot/response/{CLIENT_ID}")
    else:
        print(f"Falha na conexão ao broker MQTT (rc={rc}).")


def on_message(client, userdata, msg):
    print(f"RESPOSTA DO SERVIDOR: {msg.payload.decode()}")


# ── Verificação de integridade do hardware ────────────────────────────────────
if not check_tpm():
    print("ERRO CRÍTICO: TPM não encontrado ou não funcional. Abortando.")
    sys.exit(1)

print("Hardware TPM detectado.")

# ── Configuração do cliente MQTT ──────────────────────────────────────────────
client = mqtt.Client(mqtt.CallbackAPIVersion.VERSION2, client_id=CLIENT_ID)
client.on_connect = on_connect
client.on_message = on_message

# TLS: ativo somente se CA_CERT estiver definido e o arquivo existir
if CA_CERT and os.path.isfile(CA_CERT):
    client.tls_set(ca_certs=CA_CERT)
    print(f"TLS ativo (CA: {CA_CERT}).")
else:
    print("AVISO: Certificado CA não encontrado — conexão sem TLS (modo desenvolvimento).")
    print(f"       CA_CERT={CA_CERT!r}  |  Caminho esperado: ./certs/ca.crt")

try:
    print(f"Tentando conectar ao broker MQTT em {MQTT_BROKER}:{MQTT_PORT}...")
    client.connect(MQTT_BROKER, MQTT_PORT)
    client.loop_start()
except ConnectionRefusedError:
    print("Broker MQTT offline ou inacessível. Mantendo o contêiner vivo para testes locais.")
except Exception as e:
    print(f"Erro ao conectar: {e}")

# ── Loop de autenticação contínua via OTP ────────────────────────────────────
totp = pyotp.TOTP(OTP_SECRET, interval=60)

print("Iniciando loop de autenticação OTP...")
while True:
    payload = {
        "client_id": CLIENT_ID,
        "otp_code": totp.now(),
    }
    print(f"Enviando OTP: {payload['otp_code']}")
    try:
        client.publish(MQTT_TOPIC, json.dumps(payload))
    except Exception as e:
        print(f"Erro ao publicar mensagem: {e}")
    time.sleep(60)

