# ─────────────────────────────────────────────────────────────────────────────
# Mosquitto broker configuration — IoT-TPM MQTT server (TLS)
#
# Certificados esperados em /certs (montados via docker-compose a partir de
# iot-tpm/certs/, gerados por server/gerar_certificados.py):
#   - ca.crt      : CA que assina o certificado do servidor
#   - server.crt  : certificado do broker
#   - server.key  : chave privada do broker
#
# Para desenvolvimento sem TLS, use o listener 1883 (comentado abaixo) e ajuste
# MQTT_PORT no .env. Em produção mantenha apenas o listener 8883 (TLS).
# ─────────────────────────────────────────────────────────────────────────────

# Sem persistência de sessões por padrão (dispositivos reconectam e reenviam OTP)
persistence true
persistence_location /mosquitto/data/

# Logging para stdout do container
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ── Listener TLS (produção) ──────────────────────────────────────────────────
listener 8883 0.0.0.0
protocol mqtt

cafile   /certs/ca.crt
certfile /certs/server.crt
keyfile  /certs/server.key

# TLS mínimo 1.2
tls_version tlsv1.2

# mTLS: exigir certificado de cliente assinado pela mesma CA.
# Deixe 'false' se o cliente ainda não apresenta certificado próprio
# (o client_mqtt.py atual só valida o servidor). Mude para 'true' quando
# o provisionamento de certificados de cliente estiver ativo.
require_certificate false

# Com require_certificate true, use o CN do cert do cliente como username:
# use_identity_as_username true

# ── Listener sem TLS (apenas desenvolvimento local) ──────────────────────────
# Descomente para testes sem certificados. NÃO use em produção.
# listener 1883 0.0.0.0
# allow_anonymous true

# Enquanto não há ACL/autenticação por senha, permitir conexões anônimas no
# listener TLS (a autenticação da aplicação é feita via OTP/TOTP na camada MQTT).
# Endureça com password_file / acl_file quando necessário.
allow_anonymous true
