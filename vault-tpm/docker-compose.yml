version: '3.8'

services:
  vault:
    image: vault:1.13.3
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_DEV_ROOT_TOKEN_ID=root
    volumes:
      - ./vault-data:/vault/data
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - vault-network

  vault-initializer:
    build: 
      context: ./vault-init
      dockerfile: Dockerfile
    container_name: vault-initializer
    volumes:
      - ./tpm-data:/app/tpm-data
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    depends_on:
      - vault
    networks:
      - vault-network

  tpm-validator:
    build: 
      context: ./tpm-validator
      dockerfile: Dockerfile
    container_name: tpm-validator
    volumes:
      - ./tpm-data:/app/tpm-data
    depends_on:
      - vault-initializer
    networks:
      - vault-network

networks:
  vault-network:
    driver: bridge

volumes:
  vault-data:
    driver: local
  tpm-data:
    driver: local
