# keylime-agent-vault.yml
version: '3.8'

services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      # Persistência para dados do Vault
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      # Carrega o arquivo de configuração do host
      -./vault-config/vault.hcl:/vault/config/local.hcl:ro
    # Inicia o servidor com o arquivo de configuração (modo não-dev)
    command: "vault server -config=/vault/config/local.hcl"
    # CAP_IPC_LOCK é necessário para o Vault travar a memória
    cap_add:
      - IPC_LOCK
    networks:
      - agent-vault-net    # Para unseal pelo agente
    healthcheck:
      test: ["vault", "status", "-format=json"]
      interval: 10s
      timeout: 5s
      retries: 5

  keylime-agent:
    # Constrói a imagem customizada com curl, jq, e permissões 'tss'
    build:./keylime-agent-custom
    container_name: keylime-agent
    # Passa o dispositivo TPM resource manager para o contêiner
    devices:
      - "/dev/tpmrm0:/dev/tpmrm0"
    volumes:
      # Persistência para chaves e dados do agente
      - keylime_agent_data:/var/lib/keylime
      # Monta a configuração customizada do agente
      -./keylime-agent-config/agent.conf:/etc/keylime/agent.conf.d/01-custom.conf:ro
    networks:
      - keylime_public_net # Para falar com Verifier/Registrar
      - agent-vault-net    # Para falar com o Vault
    depends_on:
      vault:
        condition: service_healthy

volumes:
  vault_data:
  vault_logs:
  keylime_agent_data:

networks:
  agent-vault-net:
    driver: bridge # Rede interna
  keylime_public_net:
    external: true # Rede compartilhada
