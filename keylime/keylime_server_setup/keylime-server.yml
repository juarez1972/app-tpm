# keylime-server.yml
version: '3.8'

services:
  keylime-verifier:
    image: quay.io/keylime/keylime_verifier:master
    container_name: keylime-verifier
    ports:
      # Porta padrÃ£o da API do Verifier
      - "8881:8881"
    volumes:
      # Persiste a CA gerada e os dados do verifier
      - verifier_ca:/var/lib/keylime/cv_ca
    networks:
      - keylime_public_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8881/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  keylime-registrar:
    image: quay.io/keylime/keylime_registrar:master
    container_name: keylime-registrar
    ports:
      # Portas padrÃ£o da API do Registrar (HTTP e TLS)
      - "8890:8890"
      - "8891:8891"
    volumes:
      # Monta a CA gerada pelo Verifier (somente leitura)
      - verifier_ca:/var/lib/keylime/cv_ca:ro
    networks:
      - keylime_public_net
    depends_on:
      keylime-verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8890/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  keylime-tenant:
    image: quay.io/keylime/keylime_tenant:master
    container_name: keylime-tenant
    # MantÃ©m o contÃªiner em execuÃ§Ã£o para comandos 'docker exec'
    command: ["sleep", "infinity"]
    volumes:
      # Monta a CA do Verifier para confianÃ§a mÃºtua (somente leitura)
      - verifier_ca:/var/lib/keylime/cv_ca:ro
    # Monta o diretÃ³rio de payload do host para o contÃªiner
      - ./payload:/payload:ro
    networks:
      - keylime_public_net
    depends_on:
      - keylime-verifier
      - keylime-registrar

volumes:
  verifier_ca:
    driver: local

networks:
  keylime_public_net:
    # Esta rede deve ser criada manualmente:
    # docker network create keylime_public_net
    external: true
