version: "3.8"

services:
  twingate-iot:
    # CORREÇÃO: Adicionado espaço após 'build:'
    build:.
    container_name: twingate_tpm_connector
    # Network Mode: Host permite que o Twingate gerencie a rede do Raspberry/Orange Pi
    network_mode: host
    cap_add:
      - NET_ADMIN     # Obrigatório para criar a interface de túnel (tun)
      - SYS_ADMIN     # Muitas vezes necessário para operações de TPM
    devices:
      - /dev/net/tun:/dev/net/tun
      # Use /dev/tpmrm0 (Resource Manager) se disponível, senão /dev/tpm0
      - /dev/tpmrm0:/dev/tpmrm0
    environment:
      - TWINGATE_LABEL_HOSTNAME=${HOSTNAME}
      - TWINGATE_LABEL_DEPLOYED_BY=docker-tpm-arch
      - TWINGATE_LOG_LEVEL=info
    volumes:
      # Volume temporário na RAM para o JSON descriptografado
      - type: tmpfs
        target: /run/secrets
        tmpfs:
          size: 10M
      # Persistência do estado do Twingate
      - twingate_data:/var/lib/twingate
      - twingate_log:/var/log/twingate
    restart: unless-stopped

volumes:
  twingate_data:
  twingate_log:
