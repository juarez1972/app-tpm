version: '3.8'

services:
  tpm-validator:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - /dev/tpm0:/dev/tpm0
      - ./tpm-data:/app/tpm-data
    environment:
      - VAULT_ADDR=http://vault:8200
    restart: unless-stopped

  vault:
    image: vault:1.13.3
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=temp-root-token
    volumes:
      - ./vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    entrypoint: |
      sh -c "
      echo 'Iniciando Vault em modo desenvolvimento com persistência...'
      vault server -dev -dev-root-token-id=temp-root-token -dev-listen-address=0.0.0.0:8200
      "

  vault-initializer:
    build: ./vault-init
    environment:
      - TPM_VALIDATOR_URL=http://tpm-validator:5000
      - VAULT_ADDR=http://vault:8200
    volumes:
      - ./tpm-data:/app/tpm-data
    restart: unless-stopped
