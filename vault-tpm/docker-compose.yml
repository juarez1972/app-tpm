version: '3.8'

services:
  tpm-validator:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - /dev/tpm0:/dev/tpm0
      - ./tpm-data:/app/tpm-data
    environment:
      - VAULT_ADDR=http://vault:8200
    networks:
      - tpm-vault-network
    restart: unless-stopped

  vault:
    image: vault:1.13.3  # Tag válida
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=temp-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_API_ADDR=http://vault:8200
    volumes:
      - ./vault-data:/vault/data
      - ./vault-config.hcl:/vault/config/vault-config.hcl
      - ./scripts:/vault/scripts
    cap_add:
      - IPC_LOCK
    networks:
      - tpm-vault-network
    restart: unless-stopped

  vault-initializer:
    build: ./vault-init
    environment:
      - TPM_VALIDATOR_URL=http://tpm-validator:5000
      - VAULT_ADDR=http://vault:8200
    volumes:
      - ./tpm-data:/app/tpm-data
    depends_on:
      - tpm-validator
      - vault
    networks:
      - tpm-vault-network
    restart: unless-stopped

networks:
  tpm-vault-network:
    driver: bridge
