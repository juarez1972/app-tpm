# keylime-agent-vault.yml
version: '3.8'

services:
  vault:
    image: hashicorp/vault:latest # [28]
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      # Persistencia para dados do Vault
      - vault_data:/vault/file # [29, 30]
      - vault_logs:/vault/logs
      # Carrega o arquivo de configuração do host
      - ./vault.hcl:/vault/config/local.hcl:ro # [31]
    # Inicia o servidor com o arquivo de configuracao (modo não-dev)
    command: "vault server -config=/vault/config/local.hcl" # 
    # CAP_IPC_LOCK é necessário para o Vault travar a memória
    cap_add:
      - IPC_LOCK # [28, 31, 32, 33]
    networks:
      - keylime_public_net # Para gerenciamento (opcional)
      - agent-vault-net    # Para unseal pelo agente
    healthcheck:
      test: ["CMD", "vault", "status", "-format=json"]
      interval: 10s
      timeout: 5s
      retries: 5

  keylime-agent:
    # Constrói a imagem customizada com curl e jq
    build: ./keylime-agent-custom # [34]
    container_name: keylime-agent
    privileged: true # [24]
    # Alternativa mais segura para 'privileged: true':
    # devices:
    #   - "/dev/tpm0:/dev/tpm0" # [1]
    volumes:
      # Persistência para chaves e dados do agente
      - keylime_agent_data:/var/lib/keylime # 
      # Monta a configuração customizada do agente
      - ./agent.conf:/etc/keylime/agent.conf.d/01-custom.conf:ro # [20, 35, 36]
    networks:
      - keylime_public_net # Para falar com Verifier/Registrar
      - agent-vault-net    # Para falar com o Vault
    depends_on:
      vault:
        condition: service_healthy

volumes:
  vault_data:
  vault_logs:
  keylime_agent_data:

networks:
  agent-vault-net:
    driver: bridge # Rede interna
  keylime_public_net:
    external: true # Rede compartilhada [16]
