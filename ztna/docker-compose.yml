services:
  # --- BANCO DE DADOS (KEYCLOAK) ---
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- PROVEDOR DE IDENTIDADE (IDP) ---
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    depends_on:
      - keycloak-db
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_pass
      KC_HOSTNAME: localhost

  # --- OPENZITI CONTROLLER ---
  ziti-controller:
    image: openziti/quickstart:latest
    container_name: ziti-controller
    ports:
      - "1280:1280" # API do Plano de Controle
      - "8444:8443" # Console ZAC (HTTPS)
    environment:
      - ZITI_CTRL_ADVERTISED_ADDRESS=localhost
      - ZITI_CTRL_PORT=1280
      - ZITI_USER=admin
      - ZITI_PWD=password
    volumes:
      - ziti_data:/var/openziti

  # --- OPENZITI EDGE ROUTER ---
  ziti-edge-router:
    image: openziti/quickstart:latest
    container_name: ziti-edge-router
    depends_on:
      - ziti-controller
    environment:
      - ZITI_CTRL_ADVERTISED_ADDRESS=ziti-controller
      - ZITI_CTRL_PORT=1280
    command: /var/openziti/scripts/run-router.sh edge-router
    ports:
      - "3022:3022"

volumes:
  postgres_data:
  ziti_data:
